services:
  db:
    image: postgres:18
    container_name: db
    restart: unless-stopped
    env_file: '.env'
    environment:
      - POSTGRES_USER=${POSTGRESQL_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRESQL_PWD}
      - POSTGRES_DB=${POSTGRESQL_DB}
    ports:
      - '5432:5432'
    volumes:
      - ./pg/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - postgres_data:/var/lib/postgresql
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  maildev:
      image: maildev/maildev
      ports:
        - '1080:1080'
        - '1025:1025'

  rabbitmq:
      image: rabbitmq:4-management
      container_name: fn-rabbitmq
      restart: unless-stopped
      env_file: '.env'
      environment:
        - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
        - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PWD}
      ports:
        - '5672:5672'
        - '15672:15672'
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:8-alpine
    container_name: fn-redis
    restart: unless-stopped
    env_file: '.env'
    command: redis-server --requirepass ${REDIS_PWD} --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
